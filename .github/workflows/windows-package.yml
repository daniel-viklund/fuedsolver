name: Windows portable app

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/windows-portable*'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-packaging.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-packaging.txt
      - name: Build portable application
        run: python scripts/package.py
      - name: Test engine, API and recognition
        run: python -m pytest -q
      - name: Test extracted package without developer tools on PATH
        run: python scripts/check_package.py dist/Feudsolver-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Feudsolver-windows-x64
          path: dist/Feudsolver-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
